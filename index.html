<!DOCTYPE html>
<html lang="zh-CN" data-tier="1">
<head>
  <meta charset="utf-8">
  <title>方块浪潮 · 2048</title>

  <link href="style/fonts/clear-sans.css" rel="stylesheet" type="text/css">
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x1096.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone 5+ -->
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x920.png"  media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone, retina -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#24165f">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
</head>
<body>
  <!-- 动态极光背景：颜色随最大方块变化（html[data-tier]） -->
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app">
    <header class="top-bar">
      <h1 class="title">方块浪潮<span class="title-tag">2048</span></h1>
      <div class="top-actions">
        <button type="button" class="boss-button icon-button" aria-pressed="false" aria-label="Boss 模式" title="Boss 模式">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
        </button>
        <button type="button" class="restart-button icon-button" aria-label="新游戏" title="新游戏 (R)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button type="button" class="sound-button icon-button" aria-pressed="false" aria-label="静音" title="静音 (M)">
          <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        </button>
      </div>
    </header>

    <div class="scores">
      <div class="score-container">0</div>
      <div class="best-container">0</div>
    </div>

    <!-- 能量条 + 连击 -->
    <div class="energy-hud">
      <svg class="icon energy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <div class="energy-bar" role="presentation"><div class="energy-fill"></div></div>
      <span class="energy-value" aria-label="能量">0</span>
      <div class="combo" data-level="1" aria-live="polite">
        <span class="combo-count">0</span><span class="combo-label">连击</span>
        <span class="combo-multiplier"></span>
      </div>
    </div>

    <main class="board-area">
      <div class="game-container" data-combo="0">
        <div class="game-message" role="dialog" aria-live="polite">
          <div class="message-card">
            <p class="message-title"></p>
            <p class="final-score"></p>
            <div class="lower">
              <button type="button" class="btn btn-primary keep-playing-button">继续挑战</button>
              <button type="button" class="btn btn-primary revive-button">复活<span class="badge revive-left" aria-label="剩余次数">1</span></button>
              <button type="button" class="btn btn-ghost undo-over-button" data-item="undo">撤销</button>
              <button type="button" class="btn btn-ghost retry-button">再来一局</button>
            </div>
          </div>
        </div>

        <div class="grid-container">
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>

        <div class="tile-container">

        </div>

        <!-- 交换道具选中的第一个方块 -->
        <div class="cell-marker"></div>
      </div>
    </main>

    <!-- 道具栏 -->
    <footer class="item-bar">
      <button type="button" class="item-button" data-item="undo" title="撤销 (U)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span class="item-name" data-label="撤销">撤销</span>
        <span class="item-cost">15</span>
      </button>
      <button type="button" class="item-button" data-item="swap" title="交换两个方块">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
        <span class="item-name" data-label="交换">交换</span>
        <span class="item-cost">25</span>
      </button>
      <button type="button" class="item-button" data-item="hammer" title="敲碎一个方块">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 12-8.4 8.4a2.1 2.1 0 0 1-3-3L12 9"/><path d="M17.6 15 22 10.6"/><path d="m20.9 11.7-1.3-1.3c-.6-.6-.9-1.3-.9-2.1V7l-2.3-2.3a6 6 0 0 0-4.2-1.7H9l.9.9a6.2 6.2 0 0 1 1.8 4.4V10l2 2h1.2c.8 0 1.5.3 2 .8l1.3 1.3"/></svg>
        <span class="item-name" data-label="锤子">锤子</span>
        <span class="item-cost">30</span>
      </button>
      <button type="button" class="item-button clear-button" data-item="clear" title="清除 3 个最小的方块">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span class="item-name" data-label="清除">清除</span>
        <span class="item-cost">40</span>
      </button>
    </footer>
  </div>

  <!-- 弹窗放在 .app 之外：.app 的 touchstart 会阻止默认行为，导致输入框无法聚焦 -->
  <div class="dialog boss-dialog" role="dialog" aria-modal="true" aria-labelledby="boss-title">
    <div class="dialog-card">
      <p class="dialog-title" id="boss-title">Boss 模式</p>
      <div class="boss-locked">
        <p class="dialog-text">输入密钥，所有道具、清除与复活无限使用。</p>
        <input class="boss-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="密钥" aria-label="密钥">
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost dialog-cancel">取消</button>
          <button type="button" class="btn btn-primary boss-submit">确认</button>
        </div>
      </div>
      <div class="boss-unlocked">
        <p class="dialog-text">Boss 模式已开启：道具不耗能量，复活不限次数。</p>
        <div class="dialog-actions">
          <button type="button" class="btn btn-ghost dialog-cancel">返回</button>
          <button type="button" class="btn btn-danger boss-off">关闭 Boss 模式</button>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="dialog-card">
      <p class="dialog-title" id="confirm-title">重新开始？</p>
      <p class="dialog-text">当前这局的进度会被放弃。</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost dialog-cancel">继续本局</button>
        <button type="button" class="btn btn-primary confirm-restart">新游戏</button>
      </div>
    </div>
  </div>

  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/sound_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
